spring:
  application:
    name: alfa-credit-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/alfa_credit
    username: postgres
    password: postgres
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
